# =====================================================
# PUSHDOWN FILTERS
# =====================================================
filters:
  bronze:
    type: mongo
    tables:
      tickets:
        - table: tickets
          field: created_at
          strategy: incremental
      passengers:
        - table: passengers
          field: updated_at
          strategy: incremental
      routes:
        - table: routes
          field: updated_at
          strategy: incremental
      trains:
        - table: trains
          field: updated_at
          strategy: incremental
      stations:
        - table: stations
          field: updated_at
          strategy: incremental

  silver:
    type: iceberg
    tables:
      tickets:
        - table: tickets
          field: created_at
          strategy: incremental

        - table: passengers
          field: is_active
          strategy: boolean
          value: true

        - table: routes
          field: is_deleted
          strategy: boolean
          value: false

        - table: trains
          field: is_active
          strategy: boolean
          value: true

      passengers:
        - table: passengers
          field: updated_at
          strategy: incremental

      routes:
        - table: routes
          field: updated_at
          strategy: incremental

        - table: stations
          field: is_deleted
          strategy: boolean
          value: false

        - table: trains
          field: is_active
          strategy: boolean
          value: true

      trains:
        - table: trains
          field: updated_at
          strategy: incremental

      stations:
        - table: stations
          field: updated_at
          strategy: incremental

  gold:
    type: iceberg
    tables:
      cancellation_summary:
        - table: tickets
          field: created_at
          strategy: incremental

      refund_loss:
        - table: tickets
          field: created_at
          strategy: incremental

      revenue_daily:
        - table: tickets
          field: created_at
          strategy: incremental

      train_performance:
        - table: tickets
          field: created_at
          strategy: incremental

        - table: trains
          field: is_active
          strategy: boolean
          value: true

      
      

            





    