            t.net_revenue_after_refund = s.net_revenue_after_refund,
            t.avg_ticket_price = s.avg_ticket_price,
            t.updated_at = s.updated_at

        WHEN NOT MATCHED THEN
            INSERT (
                revenue_date,
                route_sk_id,
