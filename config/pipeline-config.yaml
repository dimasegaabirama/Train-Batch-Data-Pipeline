        total_discount_calculated DECIMAL(18, 2),
        net_revenue DECIMAL(18, 2),
        refunded_revenue DECIMAL(18, 2),

        net_revenue_after_refund DECIMAL(18, 2),
        avg_ticket_price DECIMAL(18, 2),

        updated_at TIMESTAMP

    query:
      - |
        MERGE INTO {full_table_name} t
        USING {table_view} s

        ON t.revenue_date = s.revenue_date
        AND t.route_sk_id = s.route_sk_id
        AND t.class_id = s.class_id

        WHEN MATCHED AND (
            NOT (t.total_tickets <=> s.total_tickets)
            OR NOT (t.gross_revenue <=> s.gross_revenue)
            OR NOT (t.total_discount_calculated <=> s.total_discount_calculated)
            OR NOT (t.net_revenue <=> s.net_revenue)
            OR NOT (t.refunded_revenue <=> s.refunded_revenue)
            OR NOT (t.net_revenue_after_refund <=> s.net_revenue_after_refund)
            OR NOT (t.avg_ticket_price <=> s.avg_ticket_price)
        )

        THEN UPDATE SET
            t.total_tickets = s.total_tickets,
            t.gross_revenue = s.gross_revenue,
            t.total_discount_calculated = s.total_discount_calculated,
            t.net_revenue = s.net_revenue,
